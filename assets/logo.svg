<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-labelledby="title desc">
  <title id="title">gh-migrate</title>
  <desc id="desc">Two account avatars joined by a dotted arc; three repository blocks travel from the faded source account on the left to the highlighted target account on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="720" height="200" rx="28" fill="url(#bg)"/>

  <g transform="translate(36 8) scale(1.2)">
    <!-- source account (faded) -->
    <circle cx="34" cy="96" r="22" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <circle cx="34" cy="89" r="5" fill="#94a3b8"/>
    <path d="M23 108a11 11 0 0 1 22 0z" fill="#94a3b8"/>

    <!-- target account (highlighted) -->
    <circle cx="186" cy="96" r="22" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="186" cy="89" r="5" fill="url(#accent)"/>
    <path d="M175 108a11 11 0 0 1 22 0z" fill="url(#accent)"/>

    <!-- trail and arrowhead -->
    <path d="M58 74Q110 8 162 74" fill="none" stroke="url(#accent)" stroke-opacity=".75" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
    <polygon points="165.7,78.7 153.6,73 163,65.6" fill="#34d399"/>

    <!-- repositories in flight -->
    <rect x="77" y="42.25" width="14" height="14" rx="3" fill="url(#accent)" opacity=".55" transform="rotate(-32.4 84 49.25)"/>
    <rect x="103" y="34" width="14" height="14" rx="3" fill="url(#accent)" opacity=".8"/>
    <rect x="129" y="42.25" width="14" height="14" rx="3" fill="url(#accent)" transform="rotate(32.4 136 49.25)"/>
  </g>

  <text x="326" y="104" font-family="'Segoe UI', 'SF Pro Display', Inter, system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1"><tspan fill="#94a3b8">gh-</tspan><tspan fill="#f8fafc">migrate</tspan></text>
  <text x="329" y="138" font-family="'Segoe UI', 'SF Pro Display', Inter, system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#94a3b8">Move repositories between GitHub accounts</text>
</svg>
